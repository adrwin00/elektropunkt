<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ElektroPunkt — Elektronik, Technik & Angebote online</title>
  <meta name="description" content="ElektroPunkt Online-Shop: Kopfhörer, TV, Laptops, Haushalt und Smart Home zu Aktionspreisen. Versandkostenfrei ab 29€.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="header"></div>
  <main id="main"></main>
  <div id="footer"></div>
  <script src="data.js"></script>
  <script src="common.js"></script>
  <script src="shopbot.js"></script>
  <script src="home.js"></script>

  <script>
    function sendHeight() {
      // Ermittlung der Gesamthöhe aller generierten Elemente
      var mainElem = document.getElementById('main');
      var body = document.body;
      var html = document.documentElement;
      
      var h = Math.max(
        body.scrollHeight, body.offsetHeight, 
        html.scrollHeight, html.offsetHeight,
        mainElem ? mainElem.scrollHeight + 300 : 0
      );

      // Nur senden, wenn die Höhe größer als ein einzelnes Suchfeld ist
      if (h > 100) {
        window.parent.postMessage({ frameHeight: h + 40 }, '*');
      }
    }

    // Senden nach dem ersten Laden
    window.addEventListener('load', function() {
      sendHeight();
      // Zusätzliche Prüfungen nach dem Rendering des dynamischen JavaScripts
      setTimeout(sendHeight, 300);
      setTimeout(sendHeight, 800);
      setTimeout(sendHeight, 1500);
    });

    // Reagieren auf Klicks (Kategorieseiten, Produktwechsel etc.)
    document.addEventListener('click', function() {
      setTimeout(sendHeight, 200);
      setTimeout(sendHeight, 600);
    });

    window.addEventListener('resize', sendHeight);
  </script>
</body>
</html>
