<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ElektroPunkt — Elektronik, Technik & Angebote online</title>
  <meta name="description" content="ElektroPunkt Online-Shop: Kopfhörer, TV, Laptops, Haushalt und Smart Home zu Aktionspreisen. Versandkostenfrei ab 29€.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="header"></div>
  <main id="main"></main>
  <div id="footer"></div>
  <script src="data.js"></script>
  <script src="common.js"></script>
  <script src="shopbot.js"></script>
  <script src="home.js"></script>

  <script>
    function sendHeight(scrollToTop) {
      var mainElem = document.getElementById('main');
      var body = document.body;
      var html = document.documentElement;
      
      var h = Math.max(
        body.scrollHeight, body.offsetHeight, 
        html.scrollHeight, html.offsetHeight,
        mainElem ? mainElem.scrollHeight + 300 : 0
      );

      if (h > 100) {
        window.parent.postMessage({ 
          frameHeight: h + 40,
          scrollTop: !!scrollToTop 
        }, '*');
      }
    }

    window.addEventListener('load', function() {
      sendHeight(true);
      setTimeout(function() { sendHeight(false); }, 300);
      setTimeout(function() { sendHeight(false); }, 800);
      setTimeout(function() { sendHeight(false); }, 1500);
    });

    // Bei jedem Klick auf ein Produkt oder eine Kategorie nach oben scrollen
    document.addEventListener('click', function() {
      setTimeout(function() { sendHeight(true); }, 150);
      setTimeout(function() { sendHeight(false); }, 600);
    });

    window.addEventListener('resize', function() { sendHeight(false); });
  </script>
</body>
</html>
